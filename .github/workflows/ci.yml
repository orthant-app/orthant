name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, deliberately. These cover the code that publishes signed,
      # notarized, IMMUTABLE releases, and until 2026-09-05 no workflow ran
      # them at all: 100+ assertions that only executed when someone
      # remembered to. They take seconds, so running them ahead of the Flutter
      # build reports a release-tooling regression in half a minute rather than
      # after a full macOS build.
      #
      # ⚠️ /bin/bash EXPLICITLY, which on macOS is 3.2. That is not incidental:
      # `#!/usr/bin/env bash` on this runner resolves to 3.2 as well, so 3.2 is
      # the oldest bash the release actually runs under, and it is the one
      # worth testing against. Before 4.4, expanding an EMPTY array under
      # `set -u` is an unbound-variable error, and tool/release.sh does exactly
      # that on the legacy (no Sparkle CI inputs) path — it would have died
      # after building and signing. Adding this step is what found it.
      #
      # Naming /bin/bash rather than `bash` keeps the guard from silently
      # weakening if a newer bash ever arrives earlier in PATH.
      - name: Release tooling tests
        run: |
          /bin/bash --version | head -1
          for suite in tool/ci/test_*.sh; do
            echo "--- $suite"
            /bin/bash "$suite"
          done

      - name: Resolve Flutter cache paths
        id: flutter-meta
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          dry-run: true

      - name: Restore Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.flutter-meta.outputs.CACHE-PATH }}
          key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.2

      - name: Restore pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.flutter-meta.outputs.PUB-CACHE-PATH }}
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build macos --debug
      - name: Run native tests
        working-directory: macos
        run: >-
          xcodebuild test
          -workspace Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=macOS'

  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      # `astro build` does NOT type-check: a .ts file with a type error builds
      # clean, proven by injecting one. Every type error caught during the site
      # redesign was caught by someone running tsc by hand, which is not a
      # check.
      #
      # Two checkers, because tsc's program contains no .astro or .mdx files at
      # all — the templates that CONSUME these types were the one place nothing
      # looked. Proven by injecting `cols={"three"}` into a RegionDiagram:
      # tsc --noEmit passed, astro check reported ts(2322). That is the same
      # blind spot that let a template change ship NaN geometry (see the
      # built-output guard in src/lib/commands.test.ts).
      #
      # The script runs `astro sync` first, so it does not depend on Build
      # having generated the astro:content types.
      - name: Typecheck
        run: npm run typecheck
        working-directory: site
      - name: Test
        run: npm test
        working-directory: site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: site
      - name: Responsive sweep
        run: npm run sweep
        working-directory: site
